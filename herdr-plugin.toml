id = "blockedpath.xray"
name = "Env Peek"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "Diff .env vs .env.example, highlight credential keys without revealing values."
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "open"
title = "Env Peek: show env diff"
contexts = ["workspace", "pane"]
command = ["node", "src/ui/open.mjs"]

[[panes]]
id = "xray"
title = "Env Peek"
placement = "popup"
width = "90%"
height = "85%"
command = ["node", "src/ui/popup.mjs"]
