id = "blockedpath.xray"
name = "Herdr Mixtape"
version = "0.3.0"
min_herdr_version = "0.8.0"
description = "Turn your git log into a shareable mixtape cover and tracklist."
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "open"
title = "Herdr Mixtape: show git log as mixtape"
contexts = ["workspace", "pane"]
command = ["node", "src/ui/open.mjs"]

[[panes]]
id = "xray"
title = "Herdr Mixtape"
placement = "popup"
width = "90%"
height = "85%"
command = ["node", "src/ui/popup.mjs"]
