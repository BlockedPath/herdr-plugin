id = "blockedpath.xray"
name = "Log Tail"
version = "0.4.0"
min_herdr_version = "0.8.0"
description = "Tail all pane logs in one filterable overlay — error highlight, focus source pane."
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "open"
title = "Log Tail: show pane logs"
contexts = ["workspace", "pane"]
command = ["node", "src/ui/open.mjs"]

[[panes]]
id = "xray"
title = "Log Tail"
placement = "popup"
width = "90%"
height = "85%"
command = ["node", "src/ui/popup.mjs"]
